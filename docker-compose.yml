services:

  # ── MySQL Database ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.2
    container_name: rajneeti-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-rajneeti_db}
      MYSQL_USER: ${DB_USERNAME:-rajneeti_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root",
             "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Spring Boot Application ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rajneeti-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Database
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-rajneeti_db}
      DB_USERNAME: ${DB_USERNAME:-rajneeti_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      # JPA
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      # JWT – required. No secret is committed: startup fails fast if unset.
      # Generate with: openssl rand -base64 48 ; then export JWT_SECRET=...
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      # CORS / WebSocket
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Logging
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-DEBUG}
      LOG_LEVEL_WS: ${LOG_LEVEL_WS:-INFO}
      LOG_LEVEL_SQL: ${LOG_LEVEL_SQL:-WARN}
      LOG_FILE: ${LOG_FILE:-logs/rajneeti.log}
      # AI bots (Module 25) – leave keys blank for heuristic-only play
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_API_KEY_1: ${AI_API_KEY_1:-}
      AI_API_KEY_2: ${AI_API_KEY_2:-}
      AI_API_KEY_3: ${AI_API_KEY_3:-}
      AI_USE_KEY_ROTATION: ${AI_USE_KEY_ROTATION:-true}
      AI_KEY_COOLDOWN_SECONDS: ${AI_KEY_COOLDOWN_SECONDS:-60}
      AI_MAX_KEY_RETRIES: ${AI_MAX_KEY_RETRIES:-3}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-5000}
      BOT_USE_LLM: ${BOT_USE_LLM:-true}
      BOT_THINK_DELAY_ENABLED: ${BOT_THINK_DELAY_ENABLED:-true}
      BOT_MIN_THINK_DELAY_MS: ${BOT_MIN_THINK_DELAY_MS:-800}
      BOT_MAX_THINK_DELAY_MS: ${BOT_MAX_THINK_DELAY_MS:-2000}
      BOT_WINDOW_GRACE_MS: ${BOT_WINDOW_GRACE_MS:-8000}
      BOT_SCHEDULER_INTERVAL_MS: ${BOT_SCHEDULER_INTERVAL_MS:-500}
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
    container_name: rajneeti-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}

volumes:
  mysql_data:
  app_logs: