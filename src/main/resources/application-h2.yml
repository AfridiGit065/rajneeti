# ============================================================
#  H2 profile – in-memory database, no external MySQL required.
#  Run with: mvn spring-boot:run -Ph2
#  Data is lost on restart (dev/demo convenience only).
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:rajneeti;DB_CLOSE_DELAY=-1;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect