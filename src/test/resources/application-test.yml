# ============================================================
#  Test profile – overrides datasource to H2 in-memory.
#  Applied automatically when @ActiveProfiles("test") is used.
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:rajneeti_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Suppress banner in tests
  main:
    banner-mode: off

# ── JWT ───────────────────────────────────────────────────────
# Fixed test secret (base64 of a 39-byte string). The JWT guard requires a
# non-blank secret of at least 32 bytes; individual test classes may still
# override with @TestPropertySource.
jwt:
  secret: dGVzdC1zZWNyZXQtdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItaG1hYy1zaGEyNTY=

# ── AI bots (Module 25) ─────────────────────────────────────────
# Tests choose deterministic heuristics and drive matches on demand:
# LLM off, no think delays, no grace wait, scheduler effectively disabled.
bot:
  use-llm: false
  think-delay-enabled: false
  window-grace-ms: 0
  min-think-delay-ms: 800
  max-think-delay-ms: 2000
  scheduler-interval-ms: 3600000

ai:
  use-key-rotation: false
  key-cooldown-seconds: 1
  max-key-retries: 1
  request-timeout-ms: 2000

logging:
  level:
    root: WARN
    com.rajneeti: WARN
